name: 'TF Infrastructure Deployment Pipeline'

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-pipeline.yml'
  
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'terraform/**'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      auto_approve:
        description: 'Skip approval for dev (dangerous!)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

env:
  TF_VERSION: '1.14.0'
  TFC_ORGANIZATION: 'Terraform-IaC-Deployments'  # Replace with your HCP Terraform organization name
  TERRAFORM_DIR: './terraform'

jobs:
  # ===============================================
  # Job 1: Detect Changed Environments
  # ===============================================
  detect-changes:
    name: '🔍 Detect Changes'
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.environments }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      changed_files: ${{ steps.detect.outputs.changed_files }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Environments
        id: detect
        run: |
          # Determine comparison base
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - use specified environment
            ENVIRONMENTS='["${{ github.event.inputs.environment }}"]'
            echo "has_changes=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR - compare with base branch
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
          else
            # Push - compare with previous commit
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              # First push to branch
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            else
              CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
            fi
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Detect which environments are affected
          ENVIRONMENTS=()
          
          if echo "$CHANGED_FILES" | grep -q "terraform/environments/dev/\|terraform/modules/\|terraform/global/"; then
            ENVIRONMENTS+=("dev")
          fi
          
          if echo "$CHANGED_FILES" | grep -q "terraform/environments/staging/\|terraform/modules/\|terraform/global/"; then
            ENVIRONMENTS+=("staging")
          fi
          
          if echo "$CHANGED_FILES" | grep -q "terraform/environments/prod/\|terraform/modules/\|terraform/global/"; then
            ENVIRONMENTS+=("prod")
          fi
          
          # Remove duplicates and format as JSON
          UNIQUE_ENVS=$(printf '%s\n' "${ENVIRONMENTS[@]}" | sort -u | jq -R . | jq -s -c .)
          
          echo "environments=${UNIQUE_ENVS}" >> $GITHUB_OUTPUT
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          if [ "$UNIQUE_ENVS" = "[]" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "::notice::No infrastructure changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "::notice::Detected changes in environments: $UNIQUE_ENVS"
          fi

  # ===============================================
  # Job 2: Format Check
  # ===============================================
  format-check:
    name: '🖌️ Format Check'
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TFC_API_TOKEN }}

      - name: Terraform Format Check
        id: fmt
        run: |
          echo "Checking Terraform formatting..."
          terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Format Check Results
        run: |
          if [ "${{ steps.fmt.outcome }}" = "failure" ]; then
            echo "::error::Terraform files are not properly formatted"
            echo "::error::Run 'terraform fmt -recursive' to fix formatting"
            exit 1
          else
            echo "::notice::✅ All files are properly formatted"
          fi

  # ===============================================
  # Job 3: Validate Configuration
  # ===============================================
  validate:
    name: '✅ Validate Configuration'
    runs-on: ubuntu-latest
    needs: [detect-changes, format-check]
    if: needs.detect-changes.outputs.has_changes == 'true'
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git for Private Modules
        run: |
          git config --global url."https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TFC_API_TOKEN }}

      - name: Terraform Init (Backend-less)
        run: |
          echo "Initializing Terraform without backend..."
          terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: |
          echo "Validating Terraform configuration..."
          terraform validate -no-color

      - name: Validation Results
        if: always()
        run: |
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            echo "::notice::✅ Configuration is valid"
          else
            echo "::error::❌ Configuration validation failed"
            exit 1
          fi

  # ===============================================
  # Job 4: Lint with TFLint
  # ===============================================
  lint:
    name: '📋 Lint (TFLint)'
    runs-on: ubuntu-latest
    needs: [detect-changes, format-check]
    if: needs.detect-changes.outputs.has_changes == 'true'
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git for Private Modules
        run: |
          git config --global url."https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Cache TFLint Plugins
        uses: actions/cache@v3
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('**/.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Initialize TFLint
        run: |
          echo "Initializing TFLint..."
          tflint --init

      - name: Run TFLint
        id: tflint
        run: |
          echo "Running TFLint analysis..."
          tflint --format=compact --recursive --minimum-failure-severity=warning
        continue-on-error: true

      - name: Generate TFLint Report
        if: always()
        run: |
          echo "Generating detailed report..."
          tflint --format=json --recursive > tflint-report.json || true

      - name: Upload TFLint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tflint-report
          path: ${{ env.TERRAFORM_DIR }}/tflint-report.json
          retention-days: 30

      - name: TFLint Results
        if: always()
        run: |
          if [ "${{ steps.tflint.outcome }}" = "success" ]; then
            echo "::notice::✅ TFLint passed with no issues"
          else
            echo "::warning::⚠️ TFLint found issues - review the report"
            # Don't fail the job, just warn
          fi

  # ===============================================
  # Job 5: Security Scan with Checkov
  # ===============================================
  security-scan:
    name: '🔒 Security Scan (Checkov)'
    runs-on: ubuntu-latest
    needs: [detect-changes, format-check]
    if: needs.detect-changes.outputs.has_changes == 'true'
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Checkov
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-checkov

      - name: Install Checkov
        run: |
          echo "Installing Checkov..."
          pip3 install checkov

      - name: Run Checkov Security Scan
        id: checkov
        run: |
          echo "Running Checkov security analysis..."
          checkov -d . \
            --framework terraform \
            --output cli \
            --output json --output-file-path console,checkov-report.json \
            --soft-fail \
            --download-external-modules true \
            --compact
        continue-on-error: true

      - name: Parse Checkov Results
        if: always()
        id: checkov_results
        run: |
          if [ -f checkov-report.json ]; then
            FAILED=$(jq -r '.summary.failed' checkov-report.json || echo "0")
            PASSED=$(jq -r '.summary.passed' checkov-report.json || echo "0")
            SKIPPED=$(jq -r '.summary.skipped' checkov-report.json || echo "0")
            
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
            
            echo "::notice::Checkov Results - Passed: $PASSED, Failed: $FAILED, Skipped: $SKIPPED"
          fi

      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: ${{ env.TERRAFORM_DIR }}/checkov-report.json
          retention-days: 30

      - name: Security Scan Summary
        if: always()
        run: |
          echo "### 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | ${{ steps.checkov_results.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | ${{ steps.checkov_results.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | ${{ steps.checkov_results.outputs.skipped }} |" >> $GITHUB_STEP_SUMMARY

  # ===============================================
  # Job 6: Quality Gate Summary
  # ===============================================
  quality-gate:
    name: '🚦 Quality Gate'
    runs-on: ubuntu-latest
    needs: [format-check, validate, lint, security-scan]
    if: always() && needs.detect-changes.outputs.has_changes == 'true'
    
    steps:
      - name: Check Quality Gate Status
        run: |
          echo "### 🚦 Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🖌️ Format | ${{ needs.format-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Validate | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          
          # Fail if critical checks failed
          if [ "${{ needs.format-check.result }}" = "failure" ] || [ "${{ needs.validate.result }}" = "failure" ]; then
            echo "::error::Quality gate failed - fix formatting and validation errors"
            exit 1
          fi
          
          echo "::notice::✅ Quality gate passed"

  # ===============================================
  # Job 7: HCP Terraform Plan (Remote Execution)
  # ===============================================
  terraform-plan:
    name: '📋 Plan: ${{ matrix.environment }}'
    runs-on: ubuntu-latest
    needs: [detect-changes, quality-gate]
    if: |
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.quality-gate.result == 'success'
    strategy:
      matrix:
        environment: ${{ fromJson(needs.detect-changes.outputs.environments) }}
      fail-fast: false
      max-parallel: 1  # Run sequentially to avoid conflicts
    
    outputs:
      run_id_dev: ${{ steps.create_run.outputs.run_id }}
      run_id_staging: ${{ steps.create_run.outputs.run_id }}
      run_id_prod: ${{ steps.create_run.outputs.run_id }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Workspace Name
        id: workspace
        run: |
          WORKSPACE_NAME="lz-infra-${{ matrix.environment }}"
          echo "name=$WORKSPACE_NAME" >> $GITHUB_OUTPUT
          echo "::notice::Planning for workspace: $WORKSPACE_NAME"

      # ============================================================
      # Get Workspace Details from HCP
      # ============================================================
      - name: Get HCP Workspace Details
        id: workspace_details
        run: |
          WORKSPACE_NAME="${{ steps.workspace.outputs.name }}"
          
          echo "Fetching workspace details from HCP..."
          WORKSPACE_RESPONSE=$(curl -s \
            --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${{ env.TFC_ORGANIZATION }}/workspaces/$WORKSPACE_NAME")
          
          WORKSPACE_ID=$(echo "$WORKSPACE_RESPONSE" | jq -r '.data.id')
          
          if [ "$WORKSPACE_ID" = "null" ]; then
            echo "::error::Workspace $WORKSPACE_NAME not found in HCP Terraform"
            exit 1
          fi
          
          echo "workspace_id=$WORKSPACE_ID" >> $GITHUB_OUTPUT
          echo "::notice::Found workspace ID: $WORKSPACE_ID"

      # ============================================================
      # Create Configuration Version
      # ============================================================
      - name: Create Configuration Version
        id: config_version
        run: |
          WORKSPACE_ID="${{ steps.workspace_details.outputs.workspace_id }}"
          
          # Determine if this is a speculative plan (PR)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SPECULATIVE="true"
            AUTO_QUEUE="false"
          else
            SPECULATIVE="false"
            AUTO_QUEUE="false"  # We'll manually queue the run
          fi
          
          echo "Creating configuration version (speculative: $SPECULATIVE)..."
          CONFIG_RESPONSE=$(curl -s \
            --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            --request POST \
            --data "{
              \"data\": {
                \"type\": \"configuration-versions\",
                \"attributes\": {
                  \"auto-queue-runs\": $AUTO_QUEUE,
                  \"speculative\": $SPECULATIVE
                }
              }
            }" \
            "https://app.terraform.io/api/v2/workspaces/$WORKSPACE_ID/configuration-versions")
          
          UPLOAD_URL=$(echo "$CONFIG_RESPONSE" | jq -r '.data.attributes."upload-url"')
          CONFIG_VERSION_ID=$(echo "$CONFIG_RESPONSE" | jq -r '.data.id')
          
          echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT
          echo "config_version_id=$CONFIG_VERSION_ID" >> $GITHUB_OUTPUT
          echo "::notice::Configuration version created: $CONFIG_VERSION_ID"

      # ============================================================
      # Package and Upload Terraform Code
      # ============================================================
      - name: Package Terraform Configuration
        run: |
          echo "Packaging Terraform configuration..."
          cd ${{ env.TERRAFORM_DIR }}
          
          # Create tarball excluding unnecessary files
          tar -czf ../terraform-config.tar.gz \
            --exclude='.terraform' \
            --exclude='.git' \
            --exclude='*.tfstate*' \
            --exclude='.terraform.lock.hcl' \
            .
          
          cd ..
          ls -lh terraform-config.tar.gz
          echo "::notice::Package created: $(du -h terraform-config.tar.gz | cut -f1)"

      - name: Upload to HCP Terraform
        run: |
          echo "Uploading configuration to HCP Terraform..."
          curl -s \
            --header "Content-Type: application/octet-stream" \
            --request PUT \
            --data-binary @terraform-config.tar.gz \
            "${{ steps.config_version.outputs.upload_url }}"
          
          echo "::notice::✅ Configuration uploaded successfully"

      # ============================================================
      # Create and Trigger Plan Run
      # ============================================================
      - name: Create Plan Run
        id: create_run
        run: |
          WORKSPACE_ID="${{ steps.workspace_details.outputs.workspace_id }}"
          CONFIG_VERSION_ID="${{ steps.config_version.outputs.config_version_id }}"
          
          # Determine if this is a destroy operation
          IS_DESTROY="false"
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            IS_DESTROY="true"
          fi
          
          # Create run message
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MESSAGE="Manual ${{ github.event.inputs.action }} triggered by @${{ github.actor }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            MESSAGE="Speculative plan for PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          else
            MESSAGE="Plan from commit ${{ github.sha }} by @${{ github.actor }}"
          fi
          
          echo "Creating plan run in HCP Terraform..."
          RUN_RESPONSE=$(curl -s \
            --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            --request POST \
            --data "{
              \"data\": {
                \"type\": \"runs\",
                \"attributes\": {
                  \"is-destroy\": $IS_DESTROY,
                  \"message\": \"$MESSAGE\",
                  \"auto-apply\": false
                },
                \"relationships\": {
                  \"workspace\": {
                    \"data\": {
                      \"type\": \"workspaces\",
                      \"id\": \"$WORKSPACE_ID\"
                    }
                  },
                  \"configuration-version\": {
                    \"data\": {
                      \"type\": \"configuration-versions\",
                      \"id\": \"$CONFIG_VERSION_ID\"
                    }
                  }
                }
              }
            }" \
            "https://app.terraform.io/api/v2/runs")
          
          RUN_ID=$(echo "$RUN_RESPONSE" | jq -r '.data.id')
          
          if [ "$RUN_ID" = "null" ]; then
            echo "::error::Failed to create run"
            echo "$RUN_RESPONSE" | jq '.'
            exit 1
          fi
          
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "::notice::✅ Run created: https://app.terraform.io/app/${{ env.TFC_ORGANIZATION }}/workspaces/${{ steps.workspace.outputs.name }}/runs/$RUN_ID"

      # ============================================================
      # Monitor Plan Progress
      # ============================================================
      - name: Monitor Plan Progress
        id: monitor_plan
        run: |
          RUN_ID="${{ steps.create_run.outputs.run_id }}"
          MAX_WAIT=900  # 15 minutes
          ELAPSED=0
          
          echo "Monitoring plan progress..."
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RUN_STATUS=$(curl -s \
              --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
              "https://app.terraform.io/api/v2/runs/$RUN_ID" \
              | jq -r '.data.attributes.status')
            
            TIMESTAMP=$(date '+%H:%M:%S')
            echo "[$TIMESTAMP] Status: $RUN_STATUS (${ELAPSED}s elapsed)"
            
            case $RUN_STATUS in
              "planned"|"planned_and_finished")
                echo "status=success" >> $GITHUB_OUTPUT
                echo "::notice::✅ Plan completed successfully"
                exit 0
                ;;
              "cost_estimated")
                echo "status=cost_estimated" >> $GITHUB_OUTPUT
                echo "::notice::✅ Plan completed with cost estimation"
                exit 0
                ;;
              "policy_checked")
                echo "status=policy_checked" >> $GITHUB_OUTPUT
                echo "::notice::✅ Plan completed with policy checks"
                exit 0
                ;;
              "errored")
                echo "status=failed" >> $GITHUB_OUTPUT
                echo "::error::❌ Plan failed"
                exit 1
                ;;
              "canceled"|"force_canceled")
                echo "status=canceled" >> $GITHUB_OUTPUT
                echo "::warning::⚠️ Plan was canceled"
                exit 1
                ;;
              *)
                sleep 15
                ELAPSED=$((ELAPSED + 15))
                ;;
            esac
          done
          
          echo "status=timeout" >> $GITHUB_OUTPUT
          echo "::error::❌ Plan timed out after ${MAX_WAIT}s"
          exit 1

      # ============================================================
      # Get Plan Details and Output
      # ============================================================
      - name: Retrieve Plan Details
        if: steps.monitor_plan.outputs.status != 'failed'
        id: plan_details
        run: |
          RUN_ID="${{ steps.create_run.outputs.run_id }}"
          
          echo "Retrieving plan details..."
          RUN_DETAILS=$(curl -s \
            --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
            "https://app.terraform.io/api/v2/runs/$RUN_ID?include=plan,cost-estimate")
          
          # Get plan ID
          PLAN_ID=$(echo "$RUN_DETAILS" | jq -r '.included[] | select(.type=="plans") | .id')
          echo "plan_id=$PLAN_ID" >> $GITHUB_OUTPUT
          
          # Get resource changes
          RESOURCE_ADDS=$(echo "$RUN_DETAILS" | jq -r '.included[] | select(.type=="plans") | .attributes."resource-additions"')
          RESOURCE_CHANGES=$(echo "$RUN_DETAILS" | jq -r '.included[] | select(.type=="plans") | .attributes."resource-changes"')
          RESOURCE_DESTROYS=$(echo "$RUN_DETAILS" | jq -r '.included[] | select(.type=="plans") | .attributes."resource-destructions"')
          
          echo "resource_adds=$RESOURCE_ADDS" >> $GITHUB_OUTPUT
          echo "resource_changes=$RESOURCE_CHANGES" >> $GITHUB_OUTPUT
          echo "resource_destroys=$RESOURCE_DESTROYS" >> $GITHUB_OUTPUT
          
          # Get cost estimate if available
          COST_ESTIMATE=$(echo "$RUN_DETAILS" | jq -r '.included[] | select(.type=="cost-estimates") | .attributes."proposed-monthly-cost"' || echo "N/A")
          echo "cost_estimate=$COST_ESTIMATE" >> $GITHUB_OUTPUT
          
          echo "::notice::Plan completed - Add: $RESOURCE_ADDS, Change: $RESOURCE_CHANGES, Destroy: $RESOURCE_DESTROYS"
          
          # Get plan output
          PLAN_LOG_URL=$(curl -s \
            --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
            "https://app.terraform.io/api/v2/plans/$PLAN_ID" \
            | jq -r '.data.attributes."log-read-url"')
          
          if [ "$PLAN_LOG_URL" != "null" ]; then
            curl -s "$PLAN_LOG_URL" > plan_output.txt
            echo "::notice::Plan output retrieved"
          fi

      # ============================================================
      # Upload Plan Artifacts
      # ============================================================
      - name: Upload Plan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: |
            plan_output.txt
          retention-days: 30

      # ============================================================
      # Comment on Pull Request
      # ============================================================
      - name: Comment Plan on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const environment = '${{ matrix.environment }}';
            const workspaceName = '${{ steps.workspace.outputs.name }}';
            const runId = '${{ steps.create_run.outputs.run_id }}';
            const status = '${{ steps.monitor_plan.outputs.status }}';
            
            // Get resource changes
            const adds = '${{ steps.plan_details.outputs.resource_adds }}' || '0';
            const changes = '${{ steps.plan_details.outputs.resource_changes }}' || '0';
            const destroys = '${{ steps.plan_details.outputs.resource_destroys }}' || '0';
            const cost = '${{ steps.plan_details.outputs.cost_estimate }}' || 'N/A';
            
            // Status emoji
            const statusEmoji = status === 'success' || status === 'policy_checked' ? '✅' : 
                               status === 'failed' ? '❌' : '⏱️';
            
            // Read plan output
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('plan_output.txt', 'utf8');
              if (planOutput.length > 60000) {
                planOutput = planOutput.substring(0, 60000) + '\n\n... (truncated, view full output in HCP Terraform)';
              }
            } catch (e) {
              planOutput = 'Plan output not available. View in HCP Terraform.';
            }
            
            const comment = `## ${statusEmoji} Terraform Plan: \`${environment}\`
            
            **Workspace:** [\`${workspaceName}\`](https://app.terraform.io/app/${{ env.TFC_ORGANIZATION }}/workspaces/${workspaceName})
            **Status:** \`${status}\`
            **Run ID:** [\`${runId}\`](https://app.terraform.io/app/${{ env.TFC_ORGANIZATION }}/workspaces/${workspaceName}/runs/${runId})
            
            ### 📊 Resource Changes
            | Action | Count |
            |--------|-------|
            | ➕ Add | ${adds} |
            | 📝 Change | ${changes} |
            | ❌ Destroy | ${destroys} |
            
            ${cost !== 'N/A' ? `**💰 Estimated Monthly Cost:** $${cost}` : ''}
            
            <details>
            <summary>📋 View Plan Output</summary>
            
            \`\`\`terraform
            ${planOutput}
            \`\`\`
            
            </details>
            
            ### 🔗 Quick Links
            - [View Run in HCP](https://app.terraform.io/app/${{ env.TFC_ORGANIZATION }}/workspaces/${workspaceName}/runs/${runId})
            - [Workspace Settings](https://app.terraform.io/app/${{ env.TFC_ORGANIZATION }}/workspaces/${workspaceName}/settings)
            
            ---
            *Triggered by @${{ github.actor }} • ${new Date().toISOString()}*
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes(`Terraform Plan: \`${environment}\``)
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  # ===============================================
  # Job 8: Manual Approval Gate
  # ===============================================
  approval:
    name: '✋ Approval Required'
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-plan]
    if: |
      always() &&
      needs.terraform-plan.result == 'success' &&
      github.event_name != 'pull_request' &&
      (contains(fromJson(needs.detect-changes.outputs.environments), 'staging') || 
       contains(fromJson(needs.detect-changes.outputs.environments), 'prod'))
    strategy:
      matrix:
        environment: ${{ fromJson(needs.detect-changes.outputs.environments) }}
    environment:
      name: approval-${{ matrix.environment }}
      url: https://app.terraform.io/app/${{ env.TFC_ORGANIZATION }}/workspaces/vlz-infra-${{ matrix.environment }}
    
    steps:
      - name: Manual Approval Notice
        run: |
          echo "### ✋ Manual Approval Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${{ matrix.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment to ${{ matrix.environment }} requires manual approval." >> $GITHUB_STEP_SUMMARY
          echo "Review the plan and approve in GitHub Actions environment protection rules." >> $GITHUB_STEP_SUMMARY
          
          echo "::notice::Waiting for approval for ${{ matrix.environment }} environment..."

  # ===============================================
  # Job 9: Apply Infrastructure Changes
  # ===============================================
  terraform-apply:
    name: '🚀 Apply: ${{ matrix.environment }}'
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-plan, approval]
    if: |
      always() &&
      needs.terraform-plan.result == 'success' &&
      github.event_name != 'pull_request' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped') &&
      (github.event.inputs.action != 'plan' || github.event.inputs.action == null)
    strategy:
      matrix:
        environment: ${{ fromJson(needs.detect-changes.outputs.environments) }}
      fail-fast: false
      max-parallel: 1
    environment:
      name: ${{ matrix.environment }}
      url: https://app.terraform.io/app/${{ env.TFC_ORGANIZATION }}/workspaces/vlz-infra-${{ matrix.environment }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Workspace Name
        id: workspace
        run: |
          WORKSPACE_NAME="vlz-infra-${{ matrix.environment }}"
          echo "name=$WORKSPACE_NAME" >> $GITHUB_OUTPUT

      # ============================================================
      # Get Latest Plan Run
      # ============================================================
      - name: Get Latest Planned Run
        id: get_run
        run: |
          WORKSPACE_NAME="${{ steps.workspace.outputs.name }}"
          
          # Get workspace ID
          WORKSPACE_ID=$(curl -s \
            --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
            "https://app.terraform.io/api/v2/organizations/${{ env.TFC_ORGANIZATION }}/workspaces/$WORKSPACE_NAME" \
            | jq -r '.data.id')
          
          # Get the most recent planned run
          RUNS_RESPONSE=$(curl -s \
            --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
            "https://app.terraform.io/api/v2/workspaces/$WORKSPACE_ID/runs?page%5Bsize%5D=1")
          
          RUN_ID=$(echo "$RUNS_RESPONSE" | jq -r '.data[0].id')
          RUN_STATUS=$(echo "$RUNS_RESPONSE" | jq -r '.data[0].attributes.status')
          
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "status=$RUN_STATUS" >> $GITHUB_OUTPUT
          
          echo "::notice::Latest run: $RUN_ID (status: $RUN_STATUS)"

      # ============================================================
      # Confirm Apply in HCP Terraform
      # ============================================================
      - name: Confirm Apply
        id: confirm_apply
        run: |
          RUN_ID="${{ steps.get_run.outputs.run_id }}"
          RUN_STATUS="${{ steps.get_run.outputs.status }}"
          
          # Check if run is in a state that can be applied
          if [[ "$RUN_STATUS" =~ ^(planned|cost_estimated|policy_checked)$ ]]; then
            echo "Confirming apply in HCP Terraform..."
            
            APPLY_RESPONSE=$(curl -s \
              --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
              --header "Content-Type: application/vnd.api+json" \
              --request POST \
              --data '{"comment":"Applied from GitHub Actions by @${{ github.actor }}"}' \
              "https://app.terraform.io/api/v2/runs/$RUN_ID/actions/apply")
            
            echo "::notice::✅ Apply confirmed in HCP Terraform"
          else
            echo "::error::Run is not in a valid state for apply: $RUN_STATUS"
            exit 1
          fi

      # ============================================================
      # Monitor Apply Progress
      # ============================================================
      - name: Monitor Apply Progress
        id: monitor_apply
        run: |
          RUN_ID="${{ steps.get_run.outputs.run_id }}"
          MAX_WAIT=1800  # 30 minutes for apply
          ELAPSED=0
          
          echo "Monitoring apply progress..."
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RUN_STATUS=$(curl -s \
              --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
              "https://app.terraform.io/api/v2/runs/$RUN_ID" \
              | jq -r '.data.attributes.status')
            
            TIMESTAMP=$(date '+%H:%M:%S')
            echo "[$TIMESTAMP] Apply status: $RUN_STATUS (${ELAPSED}s elapsed)"
            
            case $RUN_STATUS in
              "applied")
                echo "status=success" >> $GITHUB_OUTPUT
                echo "::notice::✅ Apply completed successfully"
                exit 0
                ;;
              "errored")
                echo "status=failed" >> $GITHUB_OUTPUT
                echo "::error::❌ Apply failed"
                exit 1
                ;;
              "canceled"|"force_canceled")
                echo "status=canceled" >> $GITHUB_OUTPUT
                echo "::warning::⚠️ Apply was canceled"
                exit 1
                ;;
              *)
                sleep 20
                ELAPSED=$((ELAPSED + 20))
                ;;
            esac
          done
          
          echo "status=timeout" >> $GITHUB_OUTPUT
          echo "::error::❌ Apply timed out after ${MAX_WAIT}s"
          exit 1

      # ============================================================
      # Get Apply Results and Outputs
      # ============================================================
      - name: Get Terraform Outputs
        if: steps.monitor_apply.outputs.status == 'success'
        id: outputs
        run: |
          WORKSPACE_NAME="${{ steps.workspace.outputs.name }}"
          
          echo "Retrieving Terraform outputs..."
          STATE_VERSION=$(curl -s \
            --header "Authorization: Bearer ${{ secrets.TFC_API_TOKEN }}" \
            "https://app.terraform.io/api/v2/workspaces/${{ steps.workspace.outputs.name }}/current-state-version?include=outputs")
          
          # Extract outputs
          OUTPUTS=$(echo "$STATE_VERSION" | jq -r '.included[] | select(.type=="state-version-outputs") | {(.attributes.name): .attributes.value}' | jq -s 'add')
          
          echo "outputs<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "::notice::Terraform outputs retrieved"

      # ============================================================
      # Post-Apply Summary
      # ============================================================
      - name: Apply Summary
        if: always()
        run: |
          echo "### 🚀 Terraform Apply: \`${{ matrix.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.monitor_apply.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ steps.get_run.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.monitor_apply.outputs.status }}" = "success" ]; then
            echo "✅ Infrastructure successfully deployed to ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Outputs" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.outputs.outputs }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Apply failed or was canceled" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**[View Run in HCP Terraform](https://app.terraform.io/app/${{ env.TFC_ORGANIZATION }}/workspaces/${{ steps.workspace.outputs.name }}/runs/${{ steps.get_run.outputs.run_id }})**" >> $GITHUB_STEP_SUMMARY

  # ===============================================
  # Job 10: Notification
  # ===============================================
  notify:
    name: '📢 Notify'
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-apply]
    if: always() && needs.detect-changes.outputs.has_changes == 'true'
    
    steps:
      - name: Prepare Notification
        id: prepare
        run: |
          if [ "${{ needs.terraform-apply.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "message=Infrastructure deployment completed successfully" >> $GITHUB_OUTPUT
          elif [ "${{ needs.terraform-apply.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "message=Infrastructure deployment failed" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
            echo "emoji=⏭️" >> $GITHUB_OUTPUT
            echo "message=Infrastructure deployment was skipped or is pending approval" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Notification
        if: vars.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST ${{ vars.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "${{ steps.prepare.outputs.emoji }} ${{ steps.prepare.outputs.message }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ steps.prepare.outputs.emoji }} Terraform Pipeline*\n${{ steps.prepare.outputs.message }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}"},
                    {"type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}"},
                    {"type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }}"},
                    {"type": "mrkdwn", "text": "*Environments:*\n${{ needs.detect-changes.outputs.environments }}"}
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {"type": "plain_text", "text": "View Workflow"},
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {"type": "plain_text", "text": "View HCP Terraform"},
                      "url": "https://app.terraform.io/app/${{ env.TFC_ORGANIZATION }}"
                    }
                  ]
                }
              ]
            }'

      - name: Final Summary
        if: always()
        run: |
          echo "### 📊 Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.prepare.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Message:** ${{ steps.prepare.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environments:** ${{ needs.detect-changes.outputs.environments }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Workflow completed at $(date)*" >> $GITHUB_STEP_SUMMARY